name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # scripts/release.ps1 publishes the release itself, and the tag vpk upload creates
  # there triggers this workflow. Packing the same version again fails, so skip it.
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.existing.outputs.published }}
    steps:
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if grep -qx "StreamOrchestra-${version}-full.nupkg" <<< "$assets"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} is already published. Skipping the CI release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $version"

      - name: Run tests
        shell: pwsh
        run: dotnet test StreamOrchestra.slnx -c Release --nologo

      - name: Publish framework-dependent app
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          dotnet publish src/StreamOrchestra.App/StreamOrchestra.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Version=$v `
            -p:AssemblyVersion="$v.0" `
            -p:FileVersion="$v.0" `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk

      - name: Prepare Releases directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path Releases | Out-Null

      - name: Download prior releases
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --outputDir Releases `
            --token $env:GITHUB_TOKEN

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          vpk pack `
            --packId StreamOrchestra `
            --packVersion $v `
            --packDir publish `
            --mainExe StreamOrchestra.App.exe `
            --packTitle StreamOrchestra `
            --outputDir Releases `
            --noInst `
            --framework net8.0-x64-desktop,webview2

      - name: Upload to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          vpk upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --outputDir Releases `
            --publish `
            --releaseName "StreamOrchestra v$v" `
            --tag "v$v" `
            --token $env:GITHUB_TOKEN
